<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Comprovante de Entrega</title>
<style>
  :root {
    --green: #1D9E75; --green-dark: #0F6E56; --green-light: #E1F5EE;
    --red: #E24B4A; --red-light: #FCEBEB;
    --gray-bg: #F5F5F3; --gray-border: rgba(0,0,0,0.12);
    --text: #1a1a1a; --text-muted: #666;
    --radius: 12px; --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f0ee; min-height: 100vh; padding: 0 0 4rem; color: var(--text); }
  .header { background: var(--green); color: white; padding: 1.25rem 1.25rem 1rem; text-align: center; }
  .header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  .header p { font-size: 13px; opacity: 0.85; margin-top: 3px; }
  .form-body { max-width: 480px; margin: 0 auto; padding: 1.25rem; }
  .card { background: white; border-radius: var(--radius); padding: 1.1rem; margin-bottom: 0.85rem; border: 0.5px solid var(--gray-border); }
  label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 7px; }
  input[type="text"], textarea { width: 100%; padding: 11px 13px; font-size: 16px; border: 1.5px solid #e0e0e0; border-radius: var(--radius-sm); background: white; color: var(--text); outline: none; font-family: inherit; -webkit-appearance: none; transition: border-color 0.15s; }
  input[type="text"]:focus, textarea:focus { border-color: var(--green); }
  input[type="text"]::placeholder, textarea::placeholder { color: #bbb; }
  textarea { resize: none; line-height: 1.5; }
  .required-star { color: var(--red); margin-left: 2px; }
  .foto-btns { display: flex; gap: 10px; }
  .foto-btn { flex: 1; padding: 14px 8px; border: 1.5px solid #e0e0e0; border-radius: 10px; background: white; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text); -webkit-appearance: none; }
  .foto-btn:active { background: var(--gray-bg); }
  .foto-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .preview-wrap { display: none; position: relative; border-radius: 10px; overflow: hidden; border: 2px solid var(--green); }
  .preview-wrap img { width: 100%; max-height: 300px; object-fit: contain; display: block; background: #000; }
  .preview-trocar { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 20px; font-size: 12px; padding: 5px 12px; cursor: pointer; -webkit-appearance: none; }
  .error { font-size: 12px; color: var(--red); margin-top: 8px; display: none; align-items: center; gap: 4px; }
  .error.show { display: flex; }
  .btn-enviar { width: 100%; padding: 16px; background: var(--green); color: white; border: none; border-radius: var(--radius); font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; -webkit-appearance: none; }
  .btn-enviar:active { background: var(--green-dark); }
  .btn-enviar:disabled { background: #bbb; cursor: not-allowed; }
  .spinner { width: 20px; height: 20px; border: 2.5px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #successScreen { display: none; text-align: center; padding: 4rem 2rem; max-width: 400px; margin: 0 auto; }
  .success-circle { width: 80px; height: 80px; background: var(--green-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
  .success-circle svg { width: 40px; height: 40px; color: var(--green); }
  #successScreen h2 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  #successScreen p { font-size: 15px; color: var(--text-muted); line-height: 1.6; }
  .cte-badge { display: inline-block; background: var(--green-light); color: var(--green-dark); font-size: 14px; font-weight: 600; padding: 6px 16px; border-radius: 20px; margin-top: 1rem; }
  .close-hint { font-size: 13px; color: #aaa; margin-top: 1.5rem; }
  #errorBanner { background: var(--red-light); border: 1px solid #f5c1c1; border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 1rem; font-size: 14px; color: #7a1f1f; display: none; align-items: flex-start; gap: 8px; }
  #errorBanner.show { display: flex; }
</style>
</head>
<body>

<div id="mainContent">
  <div class="header">
    <h1>Comprovante de Entrega</h1>
    <p>Preencha os dados para registrar a entrega</p>
  </div>
  <div class="form-body">

    <div id="errorBanner">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="errorBannerMsg">Erro ao enviar. Tente novamente.</span>
    </div>

    <!-- Entregador -->
    <div class="card">
      <label for="entregador">Entregador <span class="required-star">*</span></label>
      <input type="text" id="entregador" placeholder="Seu nome completo" autocomplete="off" />
      <div class="error" id="entregadorError">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Informe o nome do entregador.
      </div>
    </div>

    <!-- CTE -->
    <div class="card">
      <label for="cte">CT-e — Conhecimento de Transporte Eletrônico <span class="required-star">*</span></label>
      <input type="text" id="cte" placeholder="Número do CT-e" inputmode="numeric" autocomplete="off" />
      <div class="error" id="cteError">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Informe o número do CT-e.
      </div>
    </div>

    <!-- Destinatário -->
    <div class="card">
      <label for="destinatario">Destinatário</label>
      <input type="text" id="destinatario" placeholder="Nome de quem recebeu" autocomplete="off" />
    </div>

    <!-- Foto -->
    <div class="card">
      <label>Foto do comprovante <span class="required-star">*</span></label>
      <input type="file" accept="image/*" capture="environment" id="inputCamera" style="display:none" />
      <input type="file" accept="image/*" id="inputGaleria" style="display:none" />
      <div class="foto-btns" id="fotoBotoes">
        <button type="button" class="foto-btn" id="btnCamera">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          Câmera
        </button>
        <button type="button" class="foto-btn" id="btnGaleria">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Galeria
        </button>
      </div>
      <div class="preview-wrap" id="previewWrap">
        <img id="previewImg" alt="Comprovante" />
        <button type="button" class="preview-trocar" id="btnTrocar">Trocar foto</button>
      </div>
      <div class="error" id="fotoError">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Adicione uma foto do comprovante.
      </div>
    </div>

    <!-- Obs -->
    <div class="card">
      <label for="obs">Observações</label>
      <textarea id="obs" rows="3" placeholder="Ex: entregue ao porteiro, produto avariado..."></textarea>
    </div>

    <button type="button" class="btn-enviar" id="btnEnviar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="btnIcon" style="width:20px;height:20px;"><polyline points="20 6 9 17 4 12"/></svg>
      <div class="spinner" id="btnSpinner"></div>
      <span id="btnTxt">Registrar entrega</span>
    </button>
  </div>
</div>

<div id="successScreen">
  <div class="success-circle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <h2>Entrega registrada!</h2>
  <p>O comprovante foi enviado e salvo na planilha.</p>
  <div class="cte-badge" id="cteBadge"></div>
  <p class="close-hint">Você pode fechar esta página.</p>
</div>

<script>
// =============================================================
//  SUBSTITUA PELA URL DO SEU WEB APP (APPS SCRIPT)
// =============================================================
const SCRIPT_URL = "COLE_AQUI_A_URL_DO_SEU_WEB_APP";
// =============================================================

var fotoBase64 = null;

document.getElementById("btnCamera").addEventListener("click",  function() { document.getElementById("inputCamera").click(); });
document.getElementById("btnGaleria").addEventListener("click", function() { document.getElementById("inputGaleria").click(); });
document.getElementById("btnTrocar").addEventListener("click",  function() {
  fotoBase64 = null;
  document.getElementById("inputCamera").value  = "";
  document.getElementById("inputGaleria").value = "";
  document.getElementById("previewWrap").style.display  = "none";
  document.getElementById("fotoBotoes").style.display   = "flex";
  document.getElementById("previewImg").src = "";
});

document.getElementById("inputCamera").addEventListener("change",  function() { processarArquivo(this); });
document.getElementById("inputGaleria").addEventListener("change", function() { processarArquivo(this); });

// =============================================================
//  PROCESSAMENTO DA FOTO
//  Usa createImageBitmap (moderno, respeita EXIF automaticamente)
//  com fallback para FileReader em browsers mais antigos
// =============================================================
function processarArquivo(input) {
  var file = input.files && input.files[0];
  if (!file) return;

  var MAX_LADO = 1800; // px no lado maior — boa qualidade sem arquivo enorme
  var QUALIDADE = 0.88;

  // --- Tenta createImageBitmap (iOS 15+, Android Chrome, Firefox) ---
  if (typeof createImageBitmap !== "undefined") {
    var opts = {};
    try { opts = { imageOrientation: "from-image" }; } catch(e) {}

    createImageBitmap(file, opts).then(function(bmp) {
      var w = bmp.width, h = bmp.height;
      var scale = Math.min(1, MAX_LADO / Math.max(w, h));
      var canvas = document.createElement("canvas");
      canvas.width  = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
      fotoBase64 = canvas.toDataURL("image/jpeg", QUALIDADE);
      mostrarPreview(fotoBase64);
    }).catch(function() {
      // createImageBitmap falhou — usa FileReader
      lerComFileReader(file, MAX_LADO, QUALIDADE);
    });

  } else {
    // --- Fallback FileReader (iOS 13-14, browsers antigos) ---
    lerComFileReader(file, MAX_LADO, QUALIDADE);
  }
}

function lerComFileReader(file, maxLado, qualidade) {
  var reader = new FileReader();
  reader.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      // O browser já corrige a orientação EXIF ao carregar em img.src
      // então não precisamos fazer nada além de redimensionar
      var w = img.naturalWidth  || img.width;
      var h = img.naturalHeight || img.height;
      var scale = Math.min(1, maxLado / Math.max(w, h));
      var canvas = document.createElement("canvas");
      canvas.width  = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      fotoBase64 = canvas.toDataURL("image/jpeg", qualidade);
      mostrarPreview(fotoBase64);
    };
    img.onerror = function() { alert("Erro ao carregar imagem. Tente novamente."); };
    img.src = ev.target.result;
  };
  reader.onerror = function() { alert("Erro ao ler arquivo. Tente novamente."); };
  reader.readAsDataURL(file);
}

function mostrarPreview(src) {
  document.getElementById("previewImg").src = src;
  document.getElementById("previewWrap").style.display = "block";
  document.getElementById("fotoBotoes").style.display  = "none";
  document.getElementById("fotoError").classList.remove("show");
}

// =============================================================
//  ENVIO
// =============================================================
document.getElementById("btnEnviar").addEventListener("click", enviar);

async function enviar() {
  var entregador = document.getElementById("entregador").value.trim();
  var cte        = document.getElementById("cte").value.trim();
  var dest       = document.getElementById("destinatario").value.trim();
  var obs        = document.getElementById("obs").value.trim();

  document.getElementById("entregadorError").classList.remove("show");
  document.getElementById("cteError").classList.remove("show");
  document.getElementById("fotoError").classList.remove("show");
  document.getElementById("errorBanner").classList.remove("show");

  var valido = true;
  if (!entregador) { document.getElementById("entregadorError").classList.add("show"); valido = false; }
  if (!cte)        { document.getElementById("cteError").classList.add("show");        valido = false; }
  if (!fotoBase64) { document.getElementById("fotoError").classList.add("show");       valido = false; }
  if (!valido) return;

  var btn = document.getElementById("btnEnviar");
  btn.disabled = true;
  document.getElementById("btnIcon").style.display    = "none";
  document.getElementById("btnSpinner").style.display = "block";
  document.getElementById("btnTxt").textContent       = "Enviando...";

  try {
    var resp = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ entregador: entregador, cte: cte, destinatario: dest, obs: obs, foto: fotoBase64 }),
      headers: { "Content-Type": "text/plain" }
    });
    var data = await resp.json();
    if (data.ok) {
      document.getElementById("mainContent").style.display   = "none";
      document.getElementById("successScreen").style.display = "block";
      document.getElementById("cteBadge").textContent = "CT-e: " + cte + "  —  " + entregador;
    } else {
      throw new Error(data.msg || "Erro desconhecido");
    }
  } catch(err) {
    document.getElementById("errorBannerMsg").textContent = "Erro ao enviar: " + err.message + ". Verifique sua conexão e tente novamente.";
    document.getElementById("errorBanner").classList.add("show");
    btn.disabled = false;
    document.getElementById("btnIcon").style.display    = "block";
    document.getElementById("btnSpinner").style.display = "none";
    document.getElementById("btnTxt").textContent       = "Tentar novamente";
  }
}
</script>
</body>
</html>
